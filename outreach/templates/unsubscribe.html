<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #1b1f24; margin: 0; }
  .box { max-width: 420px; margin: 15vh auto; background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 28px; text-align: center; }
  button { background: #2f6fed; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #0f1216; color: #e6e8eb; } .box { background: #171b21; border-color: #2a3039; } }
</style></head>
<body><div class="box">
{% if done %}
  <h2>You're unsubscribed</h2>
  <p>You won't receive any more emails from {{ company or 'us' }}. Sorry for the bother.</p>
{% else %}
  <h2>Unsubscribe</h2>
  <p>Stop receiving emails from {{ company or 'us' }}?</p>
  <form method="post"><button>Unsubscribe me</button></form>
{% endif %}
</div></body></html>
